[project]
name = "nullmodels"
version = "0.1.0"
description = "Nullmodel precision-recall curve simulations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "plotnine>=0.14.4",
    "polars>=1.35.1",
    "marimo>=0.17.6",
    "scipy>=1.15.1",
    "numpy>=2.2.1",
]

[dependency-groups]
dev = [
    "pyarrow>=22.0.0",
    "marimo>=0.16.5",
    "ruff>=0.14.0",
]

[project.urls]
source = "https://github.com/mart-mihkel/nullmodels"

[build-system]
requires = ["setuptools", "wheel"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["nullmodels"]
exclude = ["notebooks"]
